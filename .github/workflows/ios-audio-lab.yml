# Лабораторный стенд (ветка lab/audio-local, в main не идёт).
# Прогон 3: сура скачивается самим приложением, файл сверяется с оригиналом,
# затем играет; зонд lab/lab-probe.js пишет каждое событие аудиоэлементов.
name: iOS audio lab

on:
  push:
    branches: [lab/audio-local]
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Зависимости
        run: npm ci

      - name: Сборка приложения с зондом
        run: |
          set -euo pipefail
          npm run build
          cp lab/lab-probe.js dist/lab-probe.js
          python3 - <<'EOF'
          p = 'dist/index.html'
          s = open(p).read()
          s = s.replace('<head>', '<head><script src="/lab-probe.js"></script>', 1)
          open(p, 'w').write(s)
          EOF
          grep -o '<head><script[^>]*>' dist/index.html

      - name: cap sync
        run: npx cap sync ios

      - name: Сборка под симулятор
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Прогон
        run: |
          set -uo pipefail
          APP=ru.annur.quran
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null
          xcrun simctl install "$DEV" "${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          DATA=$(xcrun simctl get_app_container "$DEV" "$APP" data)
          DIR="$DATA/Library/NoCloud/audio/yasser"

          # Фаза 1: приложение само качает фонотеку Ясира (автозагрузка).
          xcrun simctl launch --console-pty "$DEV" "$APP" > "${RUNNER_TEMP}/a.log" 2>&1 &
          mkdir -p ref
          for i in $(seq 1 48); do
            sleep 10
            ls -l "$DIR" 2>/dev/null | awk '{print $5, $9}' | tr '\n' ' '; echo
            if [ -f "$DIR/surah-90.mp3" ]; then break; fi
          done
          xcrun simctl terminate "$DEV" "$APP" || true
          sleep 3
          echo "== сверка файлов, скачанных приложением, с оригиналами"
          for f in "$DIR"/surah-*.mp3; do
            n=$(basename "$f" .mp3); n=${n#surah-}
            p=$(printf %03d "$n")
            curl -fsSL -o "ref/$p.mp3" "https://download.quranicaudio.com/quran/yasser_ad-dussary/$p.mp3"
            echo "LABFILE surah $n app=$(stat -f %z "$f") $(md5 -q "$f") ref=$(stat -f %z "ref/$p.mp3") $(md5 -q "ref/$p.mp3")"
          done

          # Фаза 2: сура 83 играет из файла, который скачало приложение.
          xcrun simctl launch --console-pty "$DEV" "$APP" > "${RUNNER_TEMP}/b.log" 2>&1 &
          for i in $(seq 1 40); do sleep 10; grep -q 'LAB|ALL-DONE' "${RUNNER_TEMP}/b.log" && break; done
          xcrun simctl terminate "$DEV" "$APP" || true
          cat "${RUNNER_TEMP}/a.log" "${RUNNER_TEMP}/b.log" > console.log
          grep -v readdir console.log | grep -E 'LAB\||\[warn\]' | head -300
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-lab-console
          path: console.log
