# Лабораторный стенд (ветка lab/audio-local, в main не идёт).
# Прогон: лента мусхафа на нативной прокрутке — настоящие свайпы в iOS-симуляторе через idb.
name: iOS audio lab

on:
  push:
    branches: [lab/audio-local]
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Зависимости
        run: npm ci

      - name: Сборка приложения с зондом
        run: |
          set -euo pipefail
          npm run build
          cp lab/mushaf-probe.js dist/lab-probe.js
          python3 - <<'PY'
          p = 'dist/index.html'
          s = open(p).read()
          s = s.replace('<head>', '<head><script src="/lab-probe.js"></script>', 1)
          open(p, 'w').write(s)
          PY

      - name: cap sync
        run: npx cap sync ios

      - name: Сборка под симулятор
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" CODE_SIGNING_ALLOWED=NO | tail -5

      - name: idb
        run: |
          brew tap facebook/fb
          brew install idb-companion
          python3 -m pip install --break-system-packages fb-idb || python3 -m pip install --user fb-idb
          which idb || ls ~/Library/Python/*/bin/ 2>/dev/null

      - name: Прогон
        run: |
          set +e
          export PATH="$PATH:$(ls -d ~/Library/Python/*/bin 2>/dev/null | head -1)"
          APP=ru.annur.quran
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null 2>&1; echo "bootstatus $?"
          xcrun simctl install "$DEV" "${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          idb_companion --udid "$DEV" > "${RUNNER_TEMP}/companion.log" 2>&1 &
          sleep 8
          idb connect localhost 10882 || true
          idb describe --udid "$DEV" | head -20
          xcrun simctl launch --console-pty "$DEV" "$APP" > "${RUNNER_TEMP}/a.log" 2>&1 &
          for i in $(seq 1 60); do sleep 2; grep -q 'LAB|READY' "${RUNNER_TEMP}/a.log" && break; done
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/0-ready.png
          swipe() { echo "LABSWIPE $1 $2 $3 $4 dur=$5"; idb ui swipe --udid "$DEV" --duration "$5" "$1" "$2" "$3" "$4"; sleep 2.5; }
          swipe 80 450 330 450 0.12;  xcrun simctl io "$DEV" screenshot shots/1-right.png
          swipe 80 450 330 450 0.12
          swipe 80 450 330 450 0.12;  xcrun simctl io "$DEV" screenshot shots/3-right.png
          swipe 330 450 80 450 0.12;  xcrun simctl io "$DEV" screenshot shots/4-left.png
          swipe 150 450 200 450 0.5;  xcrun simctl io "$DEV" screenshot shots/5-short.png
          swipe 20 450 390 450 0.06;  xcrun simctl io "$DEV" screenshot shots/6-fling.png
          # Скриншот посреди медленного свайпа.
          ( idb ui swipe --udid "$DEV" --duration 2.0 100 450 300 450 & ) ; sleep 1.0; xcrun simctl io "$DEV" screenshot shots/7-mid.png; sleep 3
          sleep 3
          xcrun simctl terminate "$DEV" "$APP" || true
          cp "${RUNNER_TEMP}/a.log" console.log
          grep -E 'LAB\|' console.log | head -200
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-lab-console
          path: |
            console.log
            shots/
