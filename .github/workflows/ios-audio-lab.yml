# Лабораторный стенд (ветка lab/audio-local, в main не идёт).
# Прогон 5: сплошная запись недоступна, лежат старые поаятные файлы суры 83;
# через 40 с сеть возвращается — чтение должно вернуться на сплошную запись.
name: iOS audio lab

on:
  push:
    branches: [lab/audio-local]
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Зависимости
        run: npm ci

      - name: Сборка приложения с зондом
        run: |
          set -euo pipefail
          npm run build
          cp lab/lab-probe.js dist/lab-probe.js
          python3 - <<'EOF'
          p = 'dist/index.html'
          s = open(p).read()
          s = s.replace('<head>', '<head><script src="/lab-probe.js"></script>', 1)
          open(p, 'w').write(s)
          EOF
          grep -o '<head><script[^>]*>' dist/index.html

      - name: cap sync
        run: npx cap sync ios

      - name: Сборка под симулятор
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" CODE_SIGNING_ALLOWED=NO | tail -5

      - name: Прогон
        run: |
          set +e
          APP=ru.annur.quran
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > "${RUNNER_TEMP}/boot.log" 2>&1; echo "bootstatus exit $?"; tail -3 "${RUNNER_TEMP}/boot.log"
          echo "device $DEV"
          xcrun simctl install "$DEV" "${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          DATA=$(xcrun simctl get_app_container "$DEV" "$APP" data)
          DIR="$DATA/Library/NoCloud/audio/yasser/83"
          mkdir -p "$DIR"
          for a in $(seq 1 36); do
            curl -fsSL -o "$DIR/$a.mp3" "https://everyayah.com/data/Yasser_Ad-Dussary_128kbps/083$(printf %03d $a).mp3"
          done
          ls "$DIR" | wc -l
          # Сплошная запись недоступна: как обрыв потока на телефоне.
          sudo sh -c 'echo "0.0.0.0 download.quranicaudio.com" >> /etc/hosts'
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          curl -sS -m 5 -o /dev/null -w "quranicaudio -> %{http_code}\n" https://download.quranicaudio.com/quran/yasser_ad-dussary/083.mp3 || true

          xcrun simctl launch --console-pty "$DEV" "$APP" > "${RUNNER_TEMP}/a.log" 2>&1 &
          for i in $(seq 1 120); do sleep 2; grep -q 'LAB|click' "${RUNNER_TEMP}/a.log" && break; done
          sleep 40
          # Сеть вернулась: сплошная запись снова открывается.
          sudo sed -i '' '/download.quranicaudio.com/d' /etc/hosts
          sudo dscacheutil -flushcache; sudo killall -HUP mDNSResponder
          echo "LABHOST unblocked"
          curl -sS -m 10 -o /dev/null -w "quranicaudio -> %{http_code}\n" https://download.quranicaudio.com/quran/yasser_ad-dussary/083.mp3 || true
          for i in $(seq 1 30); do sleep 10; grep -q 'LAB|ALL-DONE' "${RUNNER_TEMP}/a.log" && break; done
          xcrun simctl terminate "$DEV" "$APP" || true
          cp "${RUNNER_TEMP}/a.log" console.log
          grep -v readdir console.log | grep -E 'LAB\||\[warn\]' | head -400
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-lab-console
          path: console.log
