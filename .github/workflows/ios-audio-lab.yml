# Лабораторный стенд (ветка lab/audio-local, в main не идёт).
# Прогон: баг наложения листов при резких рывках вправо-влево (iPhone 17) — idb в симуляторе.
name: iOS audio lab

on:
  push:
    branches: [lab/audio-local]
  workflow_dispatch:

jobs:
  lab:
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Зависимости
        run: npm ci

      - name: Сборка приложения с зондом
        run: |
          set -euo pipefail
          npm run build
          cp lab/mushaf-probe.js dist/lab-probe.js
          python3 - <<'PY'
          p = 'dist/index.html'
          s = open(p).read()
          s = s.replace('<head>', '<head><script src="/lab-probe.js"></script>', 1)
          open(p, 'w').write(s)
          PY

      - name: cap sync
        run: npx cap sync ios

      - name: Сборка под симулятор
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/dd" CODE_SIGNING_ALLOWED=NO | tail -5

      - name: idb
        run: |
          brew tap facebook/fb
          brew trust facebook/fb || true
          brew install facebook/fb/idb-companion
          python3 -m pip install --break-system-packages fb-idb || python3 -m pip install --user fb-idb
          which idb || ls ~/Library/Python/*/bin/ 2>/dev/null

      - name: Прогон
        run: |
          set +e
          export PATH="$PATH:$(ls -d ~/Library/Python/*/bin 2>/dev/null | head -1)"
          APP=ru.annur.quran
          DEV=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; c=[(k,x) for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]; pm=[p for p in c if "17 Pro Max" in p[1]["name"]]; p=(pm or c)[0]; print(p[1]["udid"]); import sys as s; s.stderr.write("device %s %s\n" % (p[1]["name"], p[0]))')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b > /dev/null 2>&1; echo "bootstatus $?"
          xcrun simctl install "$DEV" "${RUNNER_TEMP}/dd/Build/Products/Debug-iphonesimulator/App.app"
          idb_companion --udid "$DEV" > "${RUNNER_TEMP}/companion.log" 2>&1 &
          sleep 8
          idb connect localhost 10882 || true
          idb describe --udid "$DEV" | head -20
          xcrun simctl launch --console-pty "$DEV" "$APP" > "${RUNNER_TEMP}/a.log" 2>&1 &
          for i in $(seq 1 60); do sleep 2; grep -q 'LAB|READY' "${RUNNER_TEMP}/a.log" && break; done
          mkdir -p shots
          xcrun simctl io "$DEV" screenshot shots/00-ready.png
          # Резкие рывки вправо-влево сериями, без пауз между рывками.
          for burst in 1 2 3 4 5 6; do
            for k in 1 2 3 4; do
              idb ui swipe --udid "$DEV" --duration 0.04 110 520 360 520
              idb ui swipe --udid "$DEV" --duration 0.04 360 520 110 520
            done
            sleep 1.5
            xcrun simctl io "$DEV" screenshot "shots/b${burst}.png"
            echo "LABBURST $burst"
          done
          # Серии в одну сторону через несколько страниц — проверка гистерезиса окна.
          for k in 1 2 3 4 5; do idb ui swipe --udid "$DEV" --duration 0.04 110 520 360 520; done
          sleep 1.5; xcrun simctl io "$DEV" screenshot shots/s1-forward.png; echo "LABSERIES forward"
          for k in 1 2 3 4 5; do idb ui swipe --udid "$DEV" --duration 0.04 360 520 110 520; done
          sleep 1.5; xcrun simctl io "$DEV" screenshot shots/s2-back.png; echo "LABSERIES back"
          for burst in 7 8 9; do
            for k in 1 2 3 4 5 6; do
              idb ui swipe --udid "$DEV" --duration 0.03 140 520 330 520
              idb ui swipe --udid "$DEV" --duration 0.03 330 520 140 520
            done
            sleep 0.4
            xcrun simctl io "$DEV" screenshot "shots/b${burst}-fast.png"
            sleep 1.5
            xcrun simctl io "$DEV" screenshot "shots/b${burst}.png"
            echo "LABBURST $burst"
          done
          sleep 3
          xcrun simctl terminate "$DEV" "$APP" || true
          cp "${RUNNER_TEMP}/a.log" console.log
          grep -E 'LAB\|' console.log | head -200
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-lab-console
          path: |
            console.log
            shots/
